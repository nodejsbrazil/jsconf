name: '🚀 CD (Website) — Publish'

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy
    steps:
      - name: Actions - Checkout
        uses: actions/checkout@v6

      - name: Actions - Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: lts/*

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Installing Dependencies
        run: npm ci

      - name: Checking Types
        run: npm run typecheck

      - name: Checking Lint
        run: npm run lint

      - name: Testing
        run: npm test

      - name: Cache Docusaurus
        uses: actions/cache@v5
        with:
          path: |
            .docusaurus
            node_modules/.cache
          key: docusaurus-${{ hashFiles('docusaurus.config.ts', 'package-lock.json') }}
          restore-keys: docusaurus-

      - name: Building
        run: npm run build
        env:
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
          WORKER_D1: ${{ secrets.WORKER_D1 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy — Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config server/wrangler.jsonc server/index.js

      - name: Deploy — Website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: 'website'
          cname: jsconf.com.br
          allow_empty_commit: true
